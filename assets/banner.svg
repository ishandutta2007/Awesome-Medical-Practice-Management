<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4ade80" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .pulse-line {
      stroke: url(#pulseGrad);
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: dash 4s linear infinite;
    }
    
    .bg-node {
      animation: float 6s ease-in-out infinite alternate;
    }

    @keyframes dash {
      0% {
        stroke-dashoffset: 1200;
      }
      100% {
        stroke-dashoffset: -1200;
      }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#glow)" />

  <!-- Animated Dynamic Background EKG / Medical Waves (Behind Text) -->
  <path class="pulse-line" d="M 0 260 L 250 260 L 280 230 L 300 290 L 330 180 L 360 320 L 390 240 L 410 260 L 650 260 L 680 220 L 710 300 L 740 160 L 770 330 L 800 240 L 820 260 L 1200 260" opacity="0.4" />
  
  <g opacity="0.15">
    <circle cx="150" cy="90" r="40" fill="#38bdf8" class="bg-node" />
    <circle cx="1050" cy="100" r="60" fill="#818cf8" class="bg-node" />
    <circle cx="950" cy="280" r="35" fill="#c084fc" class="bg-node" />
    <!-- Grid Overlay -->
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    <path d="M 150 0 V 360 M 300 0 V 360 M 450 0 V 360 M 600 0 V 360 M 750 0 V 360 M 900 0 V 360 M 1050 0 V 360" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  </g>

  <!-- Foreground Content (Guaranteed crisp and unobstructed) -->
  <!-- Header Badge -->
  <g transform="translate(440, 45)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="160" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">🏥 HEALTH-IT &amp; CLINICAL ECOSYSTEM</text>
  </g>

  <!-- Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" filter="url(#shadow)">
    Awesome Medical Practice Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" filter="url(#shadow)">
    Curated SaaS Platforms, EHR/EMR Systems &amp; Open-Source Practice Solutions
  </text>

  <!-- Feature Pills -->
  <g transform="translate(260, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="90" y="23" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="500">📅 Appointments</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="270" y="23" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="500">💳 RCM &amp; Billing</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="435" y="23" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="500">🩺 EHR / EMR</text>

    <!-- Pill 4 -->
    <rect x="525" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="605" y="23" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="500">🌐 Open Source</text>
  </g>

  <!-- Sub-footer -->
  <text x="600" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
    Updated for 2026 • Curated for Ambulatory Clinics, Health-IT Engineers &amp; Practice Administrators
  </text>
</svg>
